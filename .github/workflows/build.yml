name: Build macOS app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Versi rilis (mis. 1.0.0). Kosongkan untuk build biasa."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          if [[ -n "${{ github.event.inputs.release }}" ]]; then
            echo "VERSION=${{ github.event.inputs.release }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=1.0.0" >> "$GITHUB_ENV"
          fi
          echo "BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Unit tests (NetCore)
        run: |
          set +e
          swift test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          summary=$(grep -E "Executed [0-9]+ tests" test.log | tail -n 1)
          [ -n "$summary" ] && echo "::notice title=Tests::$summary"
          if [ "$status" -ne 0 ]; then
            msg=$( (grep -E "error:|failed|Fatal|crash" test.log || tail -n 60 test.log) | sort -u | head -n 80 \
              | sed -e 's/%/%25/g' -e "s|$GITHUB_WORKSPACE/||g" | awk '{printf "%s%%0A", $0}')
            echo "::error title=Tests failed::$msg"
          fi
          exit "$status"

      - name: Build app and DMG
        run: |
          swift --version
          chmod +x scripts/build_app.sh
          set +e
          scripts/build_app.sh 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$( (grep -E "error:|Error|failed" build.log || tail -n 40 build.log) | sort -u | head -n 60 \
              | sed -e 's/%/%25/g' -e "s|$GITHUB_WORKSPACE/||g" | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::$msg"
          fi
          exit "$status"

      - name: Self-test (real network probes on a Mac)
        run: |
          set +e
          "dist/DokterInternet.app/Contents/MacOS/DokterInternet" --selftest > selftest.log 2>&1
          status=$?
          cat selftest.log
          msg=$(grep "^SELFTEST" selftest.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          if [ "$status" -ne 0 ]; then
            echo "::error title=Self-test failed::$msg$(tail -n 5 selftest.log | grep -v SELFTEST | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          echo "::notice title=Self-test::$msg"
          # The ping interval check: does a normal user get sub-second ping on this macOS?
          /sbin/ping -n -c 3 -i 0.2 -W 1000 1.1.1.1 > ping.log 2>&1; echo "::notice title=ping -i 0.2::exit=$? $(tail -n 2 ping.log | tr '\n' ' ')"

      - name: UI screenshots
        continue-on-error: true
        run: |
          APP="dist/DokterInternet.app/Contents/MacOS/DokterInternet"
          SHOTS="$RUNNER_TEMP/shots"; mkdir -p "$SHOTS"
          shot() { # name page delay appearance [demoWiFi]
            "$APP" -startPage "$2" -autorun YES -demoWiFi "${5:-NO}" -appearance "$4" -snapshotPath "$SHOTS/$1.png" -snapshotDelay "$3" > "app-$1.log" 2>&1 &
            pid=$!
            for i in $(seq 1 $(( $3 + 20 ))); do kill -0 $pid 2>/dev/null || break; sleep 1; done
            kill $pid 2>/dev/null || true
            [ -f "$SHOTS/$1.png" ] || echo "::warning title=Screenshot $1::missing; $(tail -n 5 app-$1.log | tr '\n' ' ')"
          }
          shot diagnose diagnose 30 light
          shot speed speed 40 light
          shot dns dns 18 light
          shot wifi wifi 8 light YES
          shot wifi-dark wifi 8 dark YES
          shot diagnose-dark diagnose 30 dark
          ls -la "$SHOTS"

          cd "$SHOTS"
          git init -q
          git checkout -q -b ci-screenshots
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "UI screenshots from run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: DokterInternet-${{ env.VERSION }}-build${{ env.BUILD }}
          path: dist/*.dmg

      - name: Publish release
        if: github.event.inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Dokter Internet ${{ env.VERSION }}
          files: dist/*.dmg
          generate_release_notes: true
